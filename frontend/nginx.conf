# Nginx config for serving the built Vite SPA and proxying API calls.
#
# - Static assets are served from /usr/share/nginx/html with long cache.
# - Client-side routes fall back to index.html (SPA history routing).
# - /api/* is proxied to the backend service (name `server` on the compose
#   network); override the upstream by templating this file if deploying
#   elsewhere.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Bound connection failure when the API container is unavailable.
  proxy_connect_timeout 1s;

  # Gzip text assets.
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml;
  gzip_min_length 1024;

  # API proxy → backend container.
  location /api/ {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Uploaded voucher images (local storage provider, future-development.md §4.3)
  # → backend static mount. Skip this block when serving uploads from S3/CDN.
  location /uploads/ {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Long-cache hashed static assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: every other path serves index.html so React Router handles it.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
