name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voucherhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d voucherhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/voucherhub_test
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-chars
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Normalize release name
        id: release_name
        shell: bash
        run: |
          safe_ref="$(echo "${{ github.ref_name }}" | tr '/' '-')"
          echo "value=$safe_ref" >> "$GITHUB_OUTPUT"

      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Canonical CI gate
        run: npm run ci

      - name: Build and smoke container topology
        run: npm run smoke:containers

      - name: Package release bundle
        run: |
          mkdir -p release-bundle
          cp package.json release-bundle/
          cp -R backend/dist release-bundle/backend-dist
          cp -R frontend/dist release-bundle/frontend-dist
          cp -R shared/dist release-bundle/shared-dist
          cp -R backend/prisma release-bundle/backend-prisma
          tar -czf ec-voucherhub-${{ steps.release_name.outputs.value }}.tar.gz release-bundle

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ec-voucherhub-${{ steps.release_name.outputs.value }}
          path: ec-voucherhub-${{ steps.release_name.outputs.value }}.tar.gz

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ec-voucherhub-${{ steps.release_name.outputs.value }}.tar.gz
          generate_release_notes: true
          body: |
            Migration rollout:
            - Review migration state with `npm run db:status`
            - Apply migrations with `npm run db:deploy --workspace=backend`

            Notes:
            - `docker-compose.yml` is dev-only PostgreSQL, not a production deployment manifest.
            - Playwright E2E covers the implemented authentication, partner, and voucher flows against PostgreSQL.
