# CI cho EC-VoucherHub — monorepo npm workspaces (shared + backend + frontend).
# Stack: TypeScript/Node, Express, Prisma, React + Vite, Vitest + fast-check.
# Các lệnh dưới đây bám theo scripts trong package.json (gốc + từng workspace).
# CI chạy đầy đủ static checks, unit/integration tests và browser E2E.

name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

# Hủy các lần chạy cũ trên cùng một nhánh/PR khi có commit mới.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voucherhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d voucherhub_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/voucherhub_test
      NODE_ENV: test
      JWT_SECRET: test-secret-at-least-32-characters
      JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-chars

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Canonical CI gate
        run: npm run ci

      - name: Build and smoke container topology
        run: npm run smoke:containers

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "**/coverage/**"
          if-no-files-found: ignore

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Upload security policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-policy
          path: artifacts/security/
          if-no-files-found: ignore
